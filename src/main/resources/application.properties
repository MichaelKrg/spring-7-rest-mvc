#debug=true
logging.level.guru.springframework=debug

logging.level.org.zalando.logbook=trace

spring.flyway.enabled=false
spring.docker.compose.enabled=false
server.port=8081

#spring.security.user.name=user1
#spring.security.user.password=password1
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

spring.cache.cache-names=beerCache,beerListCache,customerCache,customerListCache

spring.kafka.bootstrap-servers=localhost:9092
#spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.consumer.group-id=sfg
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# The following version is from a spring page
spring.kafka.consumer.properties[spring.json.trusted.packages]=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

#logging.level.org.springframework.security=trace


